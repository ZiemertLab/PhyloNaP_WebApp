{% extends "base.html" %}

{% block content %}
<style>
    /* Center the error box both vertically and horizontally, enlarge text */
    .full-center {
        min-height: 70vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    .error-box {
        max-width: 900px;
        width: 100%;
        font-size: 1.15rem; /* slightly larger body text */
    }
    .error-box .alert-heading { font-size: 1.6rem; }
</style>

<div class="container full-center">
    <div class="error-box">
        <div class="alert alert-danger text-center" role="alert">
            <h4 class="alert-heading"><i class="fas fa-exclamation-triangle"></i> Error</h4>
            <p class="lead">{{ error_message }}</p>
            <hr>
            <div>
                <a href="{{ url_for('database_page') }}" class="btn btn-primary mr-2">
                    <i class="fas fa-arrow-left"></i> Back to Database
                </a>
                <a href="{{ url_for('home') }}" class="btn btn-secondary">
                    <i class="fas fa-home"></i> Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
